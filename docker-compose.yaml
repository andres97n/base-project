# docker-compose.yml
version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports: ['5432:5432']
    volumes: [pg_data:/var/lib/postgresql/data]

  mongodb:
    image: mongo:7-jammy
    ports: ['27017:27017']
    volumes: [mongo_data:/data/db]

volumes:
  pg_data:
  mongo_data: