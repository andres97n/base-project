services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ['3000:3000']
    env_file: .env
    depends_on:
      - postgres
      - mongodb

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ['5432:5432']
    volumes: [pg_data:/var/lib/postgresql/data]

  mongodb:
    image: mongo:7-jammy
    ports: ['27017:27017']
    volumes: [mongo_data:/data/db]

volumes:
  pg_data:
  mongo_data: